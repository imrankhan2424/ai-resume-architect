<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Document body -->
  <rect x="8" y="6" width="13" height="17" rx="1.5" fill="white" opacity="0.95"/>
  <!-- Lines on document -->
  <rect x="10" y="10" width="9" height="1.5" rx="0.75" fill="#7c3aed" opacity="0.6"/>
  <rect x="10" y="13" width="7" height="1.5" rx="0.75" fill="#7c3aed" opacity="0.6"/>
  <rect x="10" y="16" width="8" height="1.5" rx="0.75" fill="#7c3aed" opacity="0.6"/>
  <rect x="10" y="19" width="5" height="1.5" rx="0.75" fill="#7c3aed" opacity="0.6"/>
  <!-- Sparkle star top-right -->
  <g transform="translate(21, 7)">
    <line x1="4" y1="0" x2="4" y2="8" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="8" y2="4" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="1.2" y1="1.2" x2="6.8" y2="6.8" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <line x1="6.8" y1="1.2" x2="1.2" y2="6.8" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
